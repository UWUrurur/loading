<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Загрузка</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden;
               font-family: Arial, sans-serif; color:#ddd; }
  .slide { position:absolute; inset:0; background-size:cover; background-position:center;
           opacity:0; transition: opacity 2s ease-in-out; }
  .slide.active { opacity:1; }
  .shade { position:absolute; inset:0;
           background: linear-gradient(transparent 50%, rgba(0,0,0,.85)); }
  .info { position:absolute; left:40px; bottom:70px; }
  .info h1 { margin:0; font-size:42px; letter-spacing:2px; }
  .info p  { margin:6px 0 0; font-size:18px; color:#aaa; }
  .bar { position:absolute; left:0; bottom:0; height:6px; width:0;
         background:#8b1a1a; transition: width .3s; }
  #status { position:absolute; right:40px; bottom:25px; font-size:14px; color:#999; }
  #mute { position:absolute; top:20px; right:20px; padding:8px 14px; cursor:pointer;
          background:rgba(0,0,0,.5); border:1px solid #555; color:#ccc; }
</style>
</head>
<body>

<div id="slides"></div>
<div class="shade"></div>

<div class="info">
  <h1 id="name">НАЗВАНИЕ СЕРВЕРА</h1>
  <p id="map"></p>
</div>
<div id="status">Подключение...</div>
<div class="bar" id="bar"></div>
<div id="mute">Звук: вкл</div>

<script>
  var IMAGES = [
    "img1.jpg",
    "img2.jpg",
    "img3.jpg",
    "img4.jpg",
    "img5.jpg",
    "img6.jpg",
    "img7.jpg"
  ];
  var SLIDE_TIME = 6000;

  var TRACKS = [
    "music1.mp3",
    "music2.mp3",
    "music3.mp3",
    "music4.mp3"
  ];
  var SHUFFLE = false;
  var VOLUME = 0.3;

  var box = document.getElementById("slides");
  IMAGES.forEach(function (src) {
    var d = document.createElement("div");
    d.className = "slide";
    d.style.backgroundImage = "url('" + src + "')";
    box.appendChild(d);
  });
  var slides = box.children, cur = 0;
  slides[0].classList.add("active");
  setInterval(function () {
    slides[cur].classList.remove("active");
    cur = (cur + 1) % slides.length;
    slides[cur].classList.add("active");
  }, SLIDE_TIME);

  var music = new Audio();
  music.volume = VOLUME;
  var trackNum = SHUFFLE ? Math.floor(Math.random() * TRACKS.length) : 0;

  function playTrack() {
    music.src = TRACKS[trackNum];
    music.play();
  }
  music.onended = function () {
    if (SHUFFLE) {
      trackNum = Math.floor(Math.random() * TRACKS.length);
    } else {
      trackNum = (trackNum + 1) % TRACKS.length;
    }
    playTrack();
  };
  playTrack();

  var muteBtn = document.getElementById("mute");
  muteBtn.onclick = function () {
    music.muted = !music.muted;
    muteBtn.textContent = "Звук: " + (music.muted ? "выкл" : "вкл");
  };

  var total = 0;
  function GameDetails(servername, serverurl, mapname) {
    document.getElementById("name").textContent = servername;
    document.getElementById("map").textContent = "Карта: " + mapname;
  }
  function SetFilesTotal(t) { total = t; }
  function SetFilesNeeded(n) {
    if (total > 0) document.getElementById("bar").style.width = ((total - n) / total * 100) + "%";
  }
  function SetStatusChanged(s) { document.getElementById("status").textContent = s; }
</script>
</body>
</html>
