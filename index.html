<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Загрузка</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden;
               font-family: Arial, sans-serif; color:#ddd; }
  .slide { position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%;
           opacity:0; transition: opacity 2s ease-in-out; overflow:hidden; }
  .slide.active { opacity:1; }
  .bg { position:absolute; top:-30px; left:-30px; right:-30px; bottom:-30px;
        background-size:cover; background-position:center;
        -webkit-filter: blur(25px) brightness(0.5); filter: blur(25px) brightness(0.5); }
  .fg { position:absolute; top:0; left:0; right:0; bottom:0;
        background-size:contain; background-position:center; background-repeat:no-repeat; }
  .shade { position:absolute; top:0; left:0; right:0; bottom:0;
           background: -webkit-linear-gradient(top, rgba(0,0,0,0) 55%, rgba(0,0,0,.85));
           background: linear-gradient(to bottom, rgba(0,0,0,0) 55%, rgba(0,0,0,.85)); }
  .info { position:absolute; left:40px; bottom:70px; }
  .info h1 { margin:0; font-size:42px; letter-spacing:2px; text-shadow:0 2px 8px #000; }
  .info p  { margin:6px 0 0; font-size:18px; color:#bbb; text-shadow:0 2px 8px #000; }
  .bar { position:absolute; left:0; bottom:0; height:6px; width:0;
         background:#8b1a1a; transition: width .3s; }
  #status { position:absolute; right:40px; bottom:25px; font-size:14px; color:#999; }
  #sound-controls { position:absolute; top:18px; right:18px; z-index:2147483647;
          width:270px; padding:12px 14px; box-sizing:border-box; pointer-events:auto !important;
          background:rgba(5,9,16,.88); border:1px solid rgba(255,255,255,.28);
          border-radius:8px; box-shadow:0 8px 28px rgba(0,0,0,.5); }
  #sound-top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #mute { min-width:112px; padding:8px 12px; cursor:pointer !important; pointer-events:auto !important;
          background:#17324f; border:1px solid #537aa5; border-radius:6px; color:#f1f6fc;
          font:bold 13px Arial, sans-serif; }
  #mute:hover, #mute:focus { background:#24527e; outline:1px solid #85b9e8; }
  #volume-text { color:#dbe8f5; font-size:13px; white-space:nowrap; }
  #volume { display:block; width:100%; height:24px; margin:8px 0 2px;
          cursor:pointer !important; pointer-events:auto !important; -webkit-appearance:auto; }
  #sound-hint { color:#8ea2b6; font-size:11px; text-align:center; }
</style>
</head>
<body>

<div id="slides"></div>
<div class="shade"></div>

<div class="info">
  <h1 id="name">SERVER</h1>
  <p id="map"></p>
</div>
<div id="status">Подключение...</div>
<div class="bar" id="bar"></div>
<div id="sound-controls">
  <div id="sound-top">
    <button type="button" id="mute">Звук: вкл</button>
    <span id="volume-text">Громкость: 10%</span>
  </div>
  <input id="volume" type="range" min="0" max="100" step="1" value="10" aria-label="Громкость музыки">
  <div id="sound-hint">M — вкл/выкл · ↑/↓ — громкость</div>
</div>

<script>
  var SERVER_NAME = "";

  var IMAGES = [
    "img1.jpg",
    "img2.jpg",
    "img3.jpg",
    "img4.jpg",
    "img5.jpg",
    "img6.jpg",
    "img7.jpg",
    "img8.jpg",
    "img9.jpg",
    "img10.jpg",
    "img11.jpg",
    "img12.jpg",
    "img13.jpg"
  
  ];
  var SLIDE_TIME = 6000;

  var TRACKS = [
    "music1.mp3",
    "music2.mp3",
    "music3.mp3",
    "music4.mp3"
  ];
  var SHUFFLE = true;
  var DEFAULT_VOLUME = 0.10;

  if (SERVER_NAME !== "") {
    document.getElementById("name").textContent = SERVER_NAME;
  }

  var box = document.getElementById("slides");
  for (var i = 0; i < IMAGES.length; i++) {
    var src = IMAGES[i];
    var d = document.createElement("div");
    d.className = "slide";
    var bg = document.createElement("div");
    bg.className = "bg";
    bg.style.backgroundImage = "url('" + src + "')";
    var fg = document.createElement("div");
    fg.className = "fg";
    fg.style.backgroundImage = "url('" + src + "')";
    d.appendChild(bg);
    d.appendChild(fg);
    box.appendChild(d);
  }
  var slides = box.children, cur = 0;
  slides[0].className = "slide active";
  setInterval(function () {
    slides[cur].className = "slide";
    cur = (cur + 1) % slides.length;
    slides[cur].className = "slide active";
  }, SLIDE_TIME);

  function readNumber(key, fallback) {
    try {
      var value = parseFloat(localStorage.getItem(key));
      return isFinite(value) ? value : fallback;
    } catch (error) { return fallback; }
  }
  function readMuted() {
    try { return localStorage.getItem("hasslostan_loading_muted") === "1"; }
    catch (error) { return false; }
  }
  function saveSetting(key, value) {
    try { localStorage.setItem(key, String(value)); } catch (error) {}
  }

  var music = new Audio();
  music.preload = "auto";
  music.volume = Math.max(0, Math.min(1, readNumber("hasslostan_loading_volume", DEFAULT_VOLUME)));
  music.muted = readMuted();
  var trackNum = SHUFFLE ? Math.floor(Math.random() * TRACKS.length) : 0;
  var started = false;

  function playTrack() {
    music.src = TRACKS[trackNum];
    try {
      var p = music.play();
      if (p && p.then) {
        p.then(function () { started = true; }).catch(function () { started = false; });
      } else { started = true; }
    } catch (error) { started = false; }
  }
  music.onended = function () {
    if (SHUFFLE) {
      trackNum = Math.floor(Math.random() * TRACKS.length);
    } else {
      trackNum = (trackNum + 1) % TRACKS.length;
    }
    playTrack();
  };
  playTrack();

  function startOnInteract() {
    if (!started) {
      try {
        var p = music.play();
        if (p && p.then) { p.then(function () { started = true; }).catch(function () {}); }
      } catch (error) {}
    }
  }
  document.addEventListener("click", startOnInteract);
  document.addEventListener("keydown", startOnInteract);
  document.addEventListener("touchstart", startOnInteract);

  var muteBtn = document.getElementById("mute");
  var volumeSlider = document.getElementById("volume");
  var volumeText = document.getElementById("volume-text");

  function updateSoundUI() {
    var percent = Math.round(music.volume * 100);
    volumeSlider.value = String(percent);
    volumeText.textContent = "Громкость: " + percent + "%";
    muteBtn.textContent = "Звук: " + (music.muted || percent === 0 ? "выкл" : "вкл");
  }
  function setVolume(value) {
    var percent = Math.max(0, Math.min(100, parseInt(value, 10) || 0));
    music.volume = percent / 100;
    if (percent > 0) music.muted = false;
    saveSetting("hasslostan_loading_volume", music.volume);
    saveSetting("hasslostan_loading_muted", music.muted ? "1" : "0");
    updateSoundUI();
    startOnInteract();
  }
  function toggleMute(e) {
    if (e) {
      if (e.preventDefault) e.preventDefault();
      if (e.stopPropagation) e.stopPropagation();
    }
    music.muted = !music.muted;
    saveSetting("hasslostan_loading_muted", music.muted ? "1" : "0");
    updateSoundUI();
    startOnInteract();
    return false;
  }

  var lastPointerToggle = 0;
  muteBtn.addEventListener("mousedown", function (e) {
    lastPointerToggle = new Date().getTime();
    toggleMute(e);
  });
  muteBtn.addEventListener("touchstart", function (e) {
    lastPointerToggle = new Date().getTime();
    toggleMute(e);
  });
  muteBtn.addEventListener("click", function (e) {
    if (new Date().getTime() - lastPointerToggle < 500) {
      if (e.preventDefault) e.preventDefault();
      return false;
    }
    return toggleMute(e);
  });
  volumeSlider.addEventListener("input", function () { setVolume(volumeSlider.value); });
  volumeSlider.addEventListener("change", function () { setVolume(volumeSlider.value); });

  document.addEventListener("keydown", function (e) {
    var key = e.key || e.keyCode;
    if (key === "m" || key === "M" || key === 77) {
      toggleMute(e);
    } else if (key === "ArrowUp" || key === 38) {
      setVolume(Math.round(music.volume * 100) + 5);
    } else if (key === "ArrowDown" || key === 40) {
      setVolume(Math.round(music.volume * 100) - 5);
    }
  });

  updateSoundUI();

  var total = 0;
  function GameDetails(servername, serverurl, mapname) {
    if (SERVER_NAME === "") {
      document.getElementById("name").textContent = servername;
    }
    document.getElementById("map").textContent = "Карта: " + mapname;
  }
  function SetFilesTotal(t) { total = t; }
  function SetFilesNeeded(n) {
    if (total > 0) document.getElementById("bar").style.width = ((total - n) / total * 100) + "%";
  }
  function SetStatusChanged(s) { document.getElementById("status").textContent = s; }
</script>
</body>
</html>
